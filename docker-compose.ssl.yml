version: '3.8'

services:
  # Основное веб-приложение
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pcconf_web
    restart: unless-stopped
    networks:
      - pcconf_network
    environment:
      # Основные настройки Flask
      SECRET_KEY: ${SECRET_KEY:-pcconf_production_secret_key_change_this_very_secure_12345}
      FLASK_ENV: ${FLASK_ENV:-production}
      DEBUG: ${DEBUG:-False}
      
      # База данных
      DATABASE_URL: postgresql://${DB_USER:-pccon_user}:${DB_PASSWORD:-12345}@db:5432/${DB_NAME:-pccon_db}
      
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-12345}@redis:6379
      
      # GigaChat API
      GIGACHAT_CREDENTIALS: ${GIGACHAT_CREDENTIALS}
      
      # Общие настройки
      PYTHONPATH: /app
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
    depends_on:
      - db
      - redis

  # Nginx reverse proxy с SSL поддержкой
  nginx:
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
    container_name: pcconf_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      - pcconf_network
    environment:
      # SSL сертификаты из переменных окружения
      SSL_CERTIFICATE: ${SSL_CERTIFICATE:-}
      SSL_PRIVATE_KEY: ${SSL_PRIVATE_KEY:-}
      SSL_CERTIFICATE_CHAIN: ${SSL_CERTIFICATE_CHAIN:-}
      SSL_DH_PARAMS: ${SSL_DH_PARAMS:-}
    volumes:
      - nginx_logs:/var/log/nginx
    depends_on:
      - web

  # База данных PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: pcconf_db
    restart: unless-stopped
    networks:
      - pcconf_network
    environment:
      POSTGRES_DB: ${DB_NAME:-pccon_db}
      POSTGRES_USER: ${DB_USER:-pccon_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-12345}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pccon_user} -d ${DB_NAME:-pccon_db}"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis для кэширования
  redis:
    image: redis:7-alpine
    container_name: pcconf_redis
    restart: unless-stopped
    networks:
      - pcconf_network
    command: redis-server --requirepass ${REDIS_PASSWORD:-12345}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  pcconf_network:
    driver: bridge

volumes:
  # Том для данных приложения
  app_data:
    driver: local
  
  # Том для логов приложения
  app_logs:
    driver: local
  
  # Том для данных PostgreSQL
  postgres_data:
    driver: local
  
  # Том для данных Redis
  redis_data:
    driver: local
  
  # Том для логов nginx
  nginx_logs:
    driver: local 