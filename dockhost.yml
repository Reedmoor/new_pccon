        # Empty default.conf to override the standard one
        default.conf: |
            # This file intentionally left empty to override the default nginx configuration
            # All configuration is handled in /etc/nginx/nginx.conf

# Volumes configuration
volumes:

    postgres-data:
      size: 1Gi
      type: ssd
      mode: rwo

    nginx-logs:
      size: 1Gi
      type: hdd
      mode: rwm

    app-data:
      size: 1Gi
      type: hdd
      mode: rwm

    app-logs:
      size: 1Gi
      type: hdd
      mode: rwm

    redis-data:
      size: 1Gi
      type: hdd
      mode: rwm


# Repositories configuration
repositories:

    new-pccon:
      url: https://github.com/Reedmoor/new_pccon
      branch: main
      cpu: 1
      cpuFraction: 20
      memory: 256Mi
      dockerFile: Dockerfile
      dockerContext: .


# Containers configuration
containers:

    new-pccon:
      image: dockhost.io/d98e123e-7ffc-469e-96ff-19e09e40b977/build/new-pccon:81a831ae7d0650b14b5a56fadb2f980cb0795352
      replicas: 1
      resources:
        cpu: 1
        cpuFraction: 5
        memory: 1024Mi
      ports:
        - 5000/TCP
      variables:
        GIGACHAT_CREDENTIALS: MjZjYjAwNzUtZTllZS00YjkxLWJlOGEtYjk5N2FjMzA3ZjBmOjQ3ZTVmZmM4LTJiZGQtNDU1OC1iNDdkLTBiZmJmZDNmNWI4Ng==
        REDIS_URL: redis://:12345@redis:6379
        DATABASE_URL: postgresql://postgres:12345@postgres:5432/uipc
        FLASK_ENV: production
        DEBUG: "0"
        SECRET_KEY: pcconf_production_secret_key_change_this_very_secure_12345
        PYTHONPATH: /app
        ADMIN_CREATE: "true"
        ADMIN_USERNAME: admin
        ADMIN_PASSWORD: admin123
        ADMIN_EMAIL: admin@pcconf.ru
      volumes:
        - name: app-data
          mountPath: /app/data
        - name: app-logs
          mountPath: /app/logs

    redis:
      image: redis:7-alpine
      replicas: 1
      resources:
        cpu: 1
        cpuFraction: 5
        memory: 256Mi
      ports:
        - 6379/TCP
      variables:
        REDIS_PASSWORD: 12345
      volumes:
        - name: redis-data
          mountPath: /data

    postgres:
      image: postgres:17
      replicas: 1
      resources:
        cpu: 1
        cpuFraction: 10
        memory: 256Mi
      ports:
        - 5432/TCP
      variables:
        POSTGRES_PASSWORD: 12345
        POSTGRES_DB: uipc
        POSTGRES_USER: postgres
        POSTGRES_INITDB_ARGS: --encoding=UTF-8 --lc-collate=C --lc-ctype=C
      volumes:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data

    nginx:
      image: nginx
      replicas: 1
      resources:
        cpu: 1
        cpuFraction: 5
        memory: 64Mi
      ports:
        - 80/TCP
      configs:
        - name: nginx.conf
          mountPath: /etc/nginx/nginx.conf

# Network configuration
network:

    domains:

      pcconf:
        host: pcconf.ru
      nginx: ~

    routes:

      main:
        domain: pcconf
        path: /
        type: internal
        service: nginx
        port: 80/TCP
        
      direct:
        domain: nginx
        path: /
        type: internal
        service: nginx
        port: 80/TCP 