version: 1
project: pcconf

nameservers:
- 8.8.8.8
- 8.8.4.4

timezone: UTC

# Environments configuration
environment:
    configs:
        nginx.conf: |
            events {
                worker_connections 1024;
            }

            http {
                # Allow larger request bodies for parser uploads
                client_max_body_size 10M;
                
                # MIME types and basic settings
                include /etc/nginx/mime.types;
                default_type application/octet-stream;
                
                # Log format
                log_format detailed '$remote_addr - $remote_user [$time_local] "$request" '
                                   '$status $body_bytes_sent "$http_referer" '
                                   '"$http_user_agent" "$http_x_forwarded_for" '
                                   '"$upstream_addr" "$upstream_status" "$upstream_response_time" "$request_time"';
                
                access_log /var/log/nginx/access.log detailed;
                error_log /var/log/nginx/error.log debug;
                
                # Basic optimizations
                sendfile on;
                tcp_nopush on;
                tcp_nodelay on;
                keepalive_timeout 65;
                types_hash_max_size 2048;

                upstream web_backend {
                    server new-pccon:5000;
                }

                # Default server block for IP access
                server {
                    listen 80 default_server;
                    server_name _;
                    
                    # Special location for parser WITHOUT SSL redirect
                    location /api/parser/ {
                        proxy_pass http://web_backend;
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto http;  # Force HTTP for parser
                        
                        # Special headers for Dockhost
                        proxy_set_header X-Dockhost-Parser "true";
                        proxy_set_header X-No-SSL-Redirect "true";
                        
                        # Increased timeouts
                        proxy_connect_timeout 60s;
                        proxy_send_timeout 60s;
                        proxy_read_timeout 60s;
                        
                        # Disable redirects
                        proxy_redirect off;
                    }
                    
                    # Health check endpoint
                    location /nginx-health {
                        access_log off;
                        return 200 "nginx is working fine\n";
                        add_header Content-Type text/plain;
                    }
                    
                    # Backend health check
                    location /backend-health {
                        proxy_pass http://web_backend/;
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto $scheme;
                        proxy_connect_timeout 5s;
                        proxy_send_timeout 5s;
                        proxy_read_timeout 5s;
                        
                        # Add debugging headers
                        add_header X-Backend-Status "testing" always;
                    }
                    
                    location / {
                        proxy_pass http://web_backend;
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto $scheme;
                        proxy_connect_timeout 30s;
                        proxy_send_timeout 30s;
                        proxy_read_timeout 30s;
                        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
                        
                        # Add error handling for debugging
                        proxy_intercept_errors on;
                        error_page 502 503 504 = @backend_error;
                    }
                    
                    # Backend error handler
                    location @backend_error {
                        return 503 "Backend service (new-pccon:5000) is unavailable. Please check container status.\n";
                        add_header Content-Type text/plain;
                    }
                    
                    location /static/ {
                        proxy_pass http://web_backend;
                        expires 1y;
                        add_header Cache-Control "public, immutable";
                    }
                }

                # Named virtual host for pcconf.ru
                server {
                    listen 80;
                    server_name pcconf.ru www.pcconf.ru;
                    
                    # Special location for parser WITHOUT SSL redirect
                    location /api/parser/ {
                        proxy_pass http://web_backend;
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto http;  # Force HTTP for parser
                        
                        # Special headers for Dockhost
                        proxy_set_header X-Dockhost-Parser "true";
                        proxy_set_header X-No-SSL-Redirect "true";
                        
                        # Increased timeouts
                        proxy_connect_timeout 60s;
                        proxy_send_timeout 60s;
                        proxy_read_timeout 60s;
                        
                        # Disable redirects
                        proxy_redirect off;
                    }
                    
                    location / {
                        proxy_pass http://web_backend;
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto $scheme;
                        proxy_connect_timeout 30s;
                        proxy_send_timeout 30s;
                        proxy_read_timeout 30s;
                    }
                    
                    location /static/ {
                        proxy_pass http://web_backend;
                        expires 1y;
                        add_header Cache-Control "public, immutable";
                    }
                }

                # Compression settings
                gzip on;
                gzip_vary on;
                gzip_min_length 1024;
                gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
            }
        
