version: 1
project: pcconf

nameservers:
- 8.8.8.8
- 8.8.4.4

timezone: UTC

# Environment configuration
environment:
  variables:
    SECRET_KEY: pcconf_production_secret_key_change_this_very_secure_12345
    FLASK_ENV: production
    DEBUG: "False"
    DATABASE_URL: postgresql://postgres:12345@postgres:5432/uipc
    REDIS_URL: redis://redis:6379
    PYTHONPATH: /app
    GIGACHAT_CREDENTIALS: MjZjYjAwNzUtZTllZS00YjkxLWJlOGEtYjk5N2FjMzA3ZjBmOjQ3ZTVmZmM4LTJiZGQtNDU1OC1iNDdkLTBiZmJmZDNmNWI4Ng==

  configs:
    nginx.conf: |
      events {
          worker_connections 1024;
      }
      
      http {
          client_max_body_size 10M;
          
          upstream web_backend {
              server new-pccon:5000;
          }
      
          # HTTP сервер (порт 80)
          server {
              listen 80;
              server_name pcconf.ru www.pcconf.ru _;
              
              # Добавляем логирование для отладки
              access_log /var/log/nginx/access.log;
              error_log /var/log/nginx/error.log;
              
              location / {
                  proxy_pass http://web_backend;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  # Передаем информацию о протоколе от хостинга
                  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
                  proxy_set_header X-Forwarded-Host $host;
                  proxy_set_header X-Forwarded-Server $host;
                  
                  # Таймауты
                  proxy_connect_timeout 300s;
                  proxy_send_timeout 300s;
                  proxy_read_timeout 300s;
                  
                  # Отключаем буферизацию для админских операций
                  proxy_buffering off;
                  proxy_request_buffering off;
              }
              
              # Админские операции с увеличенными таймаутами
              location ~ ^/(admin|api)/(import|parse|run|upload) {
                  proxy_pass http://web_backend;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
                  proxy_set_header X-Forwarded-Host $host;
                  
                  # Увеличенные таймауты для операций
                  proxy_connect_timeout 600s;
                  proxy_send_timeout 600s;
                  proxy_read_timeout 600s;
                  
                  # Большой размер файлов
                  client_max_body_size 50M;
                  
                  # Отключаем буферизацию
                  proxy_buffering off;
                  proxy_request_buffering off;
              }
              
              # Статические файлы
              location /static/ {
                  proxy_pass http://web_backend;
                  expires 1y;
                  add_header Cache-Control "public, immutable";
              }
              
              # Health check
              location /health {
                  return 200 "OK";
                  add_header Content-Type text/plain;
              }
              
              # Favicon
              location /favicon.ico {
                  proxy_pass http://web_backend;
                  expires 1y;
              }
          }

          # HTTPS сервер (порт 443) - хостинг терминирует SSL и направляет сюда
          server {
              listen 443;
              server_name pcconf.ru www.pcconf.ru _;
              
              # Добавляем логирование для отладки
              access_log /var/log/nginx/access_ssl.log;
              error_log /var/log/nginx/error_ssl.log;
              
              location / {
                  proxy_pass http://web_backend;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  # Принудительно устанавливаем HTTPS для запросов с 443 порта
                  proxy_set_header X-Forwarded-Proto https;
                  proxy_set_header X-Forwarded-Host $host;
                  proxy_set_header X-Forwarded-Server $host;
                  
                  # Таймауты
                  proxy_connect_timeout 300s;
                  proxy_send_timeout 300s;
                  proxy_read_timeout 300s;
                  
                  # Отключаем буферизацию для админских операций
                  proxy_buffering off;
                  proxy_request_buffering off;
              }
              
              # Админские операции с увеличенными таймаутами
              location ~ ^/(admin|api)/(import|parse|run|upload) {
                  proxy_pass http://web_backend;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;
                  proxy_set_header X-Forwarded-Host $host;
                  
                  # Увеличенные таймауты для операций
                  proxy_connect_timeout 600s;
                  proxy_send_timeout 600s;
                  proxy_read_timeout 600s;
                  
                  # Большой размер файлов
                  client_max_body_size 50M;
                  
                  # Отключаем буферизацию
                  proxy_buffering off;
                  proxy_request_buffering off;
              }
              
              # Статические файлы
              location /static/ {
                  proxy_pass http://web_backend;
                  expires 1y;
                  add_header Cache-Control "public, immutable";
              }
              
              # Health check
              location /health {
                  return 200 "OK";
                  add_header Content-Type text/plain;
              }
              
              # Favicon
              location /favicon.ico {
                  proxy_pass http://web_backend;
                  expires 1y;
              }
          }
      
          # Security headers (без HSTS - хостинг управляет SSL)
          add_header X-Frame-Options DENY always;
          add_header X-Content-Type-Options nosniff always;
          add_header X-XSS-Protection "1; mode=block" always;
          
          # Compression
          gzip on;
          gzip_vary on;
          gzip_min_length 1024;
          gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
      }

# Repositories configuration
repositories:
  new-pccon:
    url: https://github.com/Reedmoor/new_pccon
    branch: main
    cpu: 1
    cpuFraction: 5
    memory: 64MiB
    dockerFile: Dockerfile
    dockerContext: .

# Containers configuration
containers:
  # Main web application
  new-pccon:
    image: dockhost.io/d98e123e-7ffc-469e-96ff-19e09e40b977/build/new-pccon:4b3757477a64ce4d146125978e8fb5773bdf7e19
    replicas: 2
    resources:
      cpu: 1
      cpuFraction: 5
      memory: 512MiB
    ports:
      - 5000/TCP
    variables:
      SECRET_KEY: pcconf_production_secret_key_change_this_very_secure_12345
      FLASK_ENV: production
      DEBUG: "False"
      DATABASE_URL: postgresql://postgres:12345@postgres:5432/uipc
      REDIS_URL: redis://redis:6379
      PYTHONPATH: /app
      GIGACHAT_CREDENTIALS: MjZjYjAwNzUtZTllZS00YjkxLWJlOGEtYjk5N2FjMzA3ZjBmOjQ3ZTVmZmM4LTJiZGQtNDU1OC1iNDdkLTBiZmJmZDNmNWI4Ng==
      ADMIN_CREATE: "true"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      ADMIN_EMAIL: admin@pcconf.ru
    volumes:
      - name: app-data
        mountPath: /app/data
      - name: app-logs
        mountPath: /app/logs

  # PostgreSQL database
  postgres:
    image: postgres:17-alpine
    replicas: 1
    resources:
      cpu: 1
      cpuFraction: 5
      memory: 64MiB
    ports:
      - 5432/TCP
    variables:
      POSTGRES_DB: uipc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "12345"
    volumes:
      - name: postgres-data
        mountPath: /var/lib/postgresql/data

  # Redis cache
  redis:
    image: redis:7-alpine
    replicas: 1
    resources:
      cpu: 1
      cpuFraction: 5
      memory: 64MiB
    ports:
      - 6379/TCP
    volumes:
      - name: redis-data
        mountPath: /data

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    replicas: 1
    resources:
      cpu: 1
      cpuFraction: 20
      memory: 64MiB
    ports:
      - 80/TCP
      - 443/TCP
    configs:
      - name: nginx.conf
        mountPath: /etc/nginx/nginx.conf
    volumes:
      - name: nginx-logs
        mountPath: /var/log/nginx

# Volumes configuration
volumes:
  app-data:
    type: ssd
    size: 2GiB
    mode: rwm

  app-logs:
    type: ssd
    size: 1GiB
    mode: rwm

  postgres-data:
    type: ssd
    size: 5GiB
    mode: rwm

  redis-data:
    type: ssd
    size: 512MiB
    mode: rwm

  nginx-logs:
    type: ssd
    size: 512MiB
    mode: rwm

# Network configuration
network:
  domains:
    nginx: ~
    pcconf.ru:
      host: pcconf.ru
    www.pcconf.ru:
      host: www.pcconf.ru

  routes:
    main_http:
      domain: pcconf.ru
      path: /
      service: nginx
      port: 80/TCP
    
    main_https:
      domain: pcconf.ru
      path: /
      service: nginx
      port: 443/TCP
    
    www_http:
      domain: www.pcconf.ru
      path: /
      service: nginx
      port: 80/TCP
    
    www_https:
      domain: www.pcconf.ru
      path: /
      service: nginx
      port: 443/TCP 